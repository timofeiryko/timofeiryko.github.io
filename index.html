    a { color: #dedede; text-decoration: none; transition: color .18s, background .18s; }
    .item { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; padding: 10px 12px; margin-inline: -12px; border-radius: 8px; font-size: 16px; line-height: 1.5; }
    .arrow { color: #717171; font-size: 15px; }
    a:hover { color: #fff; background: #141414; }
    a:focus-visible { outline: 2px solid #b4b4b4; outline-offset: 4px; }


    .email { margin: 10px 0 0; font-size: 14px; line-height: 1.6; }
    .email a { display: inline-flex; align-items: center; min-height: 44px; color: #b4b4b4; border-radius: 8px; overflow-wrap: anywhere; }
    @media (max-width: 480px) { body { padding: 44px 24px; } header { margin-bottom: 36px; } section { grid-template-columns: 1fr; gap: 12px; padding: 22px 0; } h2 { padding-top: 0; } .item { font-size: 15px; } }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } }
  
    .channel-description { display: block; margin-top: 3px; color: #939393; font-size: 12px; font-weight: 400; line-height: 1.5; }
  
    .header-meta { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .cv-link { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 0 8px 12px; border-radius: 8px; color: #b4b4b4; font-size: 14px; white-space: nowrap; }
    footer { padding-top: 24px; border-top: 1px solid #242424; }
    .social-links { flex-direction: row; gap: 12px; margin-left: -12px; }
    .social-links a { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #a3a3a3; border-radius: 10px; }
    .social-links a:hover { color: #fff; }
    .social-links svg { width: 20px; height: 20px; fill: currentColor; }
    .email { margin-top: 2px; }
  
    .channel-title { display: flex; align-items: center; gap: 9px; }
    .inline-icon { width: 16px; height: 16px; flex: none; fill: currentColor; color: #8d8d8d; }
