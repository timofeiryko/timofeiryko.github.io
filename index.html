  <style>
   :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 64px 28px; background: #0a0a0a; color: #e8e8e8; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 400; -webkit-font-smoothing: antialiased; }
    main { width: 100%; max-width: 580px; }
    header { margin-bottom: 48px; }
    h1 { margin: 0 0 12px; font-size: clamp(32px, 6vw, 44px); font-weight: 500; line-height: 1.15; letter-spacing: -.035em; }
    .tagline { margin: 0; color: #939393; font-size: 15px; line-height: 1.6; }
    section { display: grid; grid-template-columns: 144px minmax(0, 1fr); gap: 20px; padding: 26px 0; border-top: 1px solid #242424; }
    h2 { margin: 0; padding-top: 13px; color: #969696; font-size: 12px; line-height: 1.5; font-weight: 500; letter-spacing: .035em; }
    nav { display: flex; flex-direction: column; align-items: stretch; }
    a { color: #dedede; text-decoration: none; transition: color .18s, background .18s; }
    .item { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; padding: 10px 12px; margin-inline: -12px; border-radius: 8px; font-size: 16px; line-height: 1.5; }
    .arrow { color: #717171; font-size: 15px; }
    a:hover { color: #fff; background: #141414; }
    a:focus-visible { outline: 2px solid #b4b4b4; outline-offset: 4px; }
    .contacts { display: flex; flex-direction: row; flex-wrap: wrap; gap: 0 22px; }
    .contacts a { display: inline-flex; align-items: center; min-height: 44px; border-radius: 8px; font-size: 14px; }
    .email { margin: 10px 0 0; font-size: 14px; line-height: 1.6; }
    .email a { display: inline-flex; align-items: center; min-height: 44px; color: #b4b4b4; border-radius: 8px; overflow-wrap: anywhere; }
    @media (max-width: 480px) { body { padding: 44px 24px; } header { margin-bottom: 36px; } section { grid-template-columns: 1fr; gap: 12px; padding: 22px 0; } h2 { padding-top: 0; } .item { font-size: 15px; } }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } }
  
    .channel-description { display: block; margin-top: 3px; color: #939393; font-size: 12px; font-weight: 400; line-height: 1.5; }
  </style>
